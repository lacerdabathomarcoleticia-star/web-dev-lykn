<!DOCTYPE html>
<html lang="Pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <title>Document</title>
</head>
<body>
    <h2 class="centralizar">Formulario</h2>
 <nav>
 <form>
    <fieldset>
        <legend>Preencha aqui:</legend>
        <h4>Nome completo:</h4>
    <form>
     <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome">
    </form>
    <form>
    <label for="sobrenome">Sobrenome:</label>
    <input type="text" id="sobrenome" name="sobrenome">
  </form>
   <h4>Qual é o seu membro favorito do LYKN?</h4>
 <select  name="MEMBRO FAVORITO">
    <option value="TUI">TUI</option>
    <option value="HONG">HONG</option>
    <option value="NUT">NUT</option>
    <option value="LEGO">LEGO</option>
    <option value="WILLIAM">WILLIAM</option>
     </select>
    
   <h4>Qual é o seu gênero?</h4>
  <form>
    <span>masculino</span>
    <input type="radio" name="Genero" value="masculino">
    <span>feminino</span>
    <input type="radio" name="Genero" value="feminino">
    <span>outro</span>
    <input type="radio" name="Genero" value="outro">
 <h4>Selecione sua idade:</h4>
 </form>
 <form>
    <label for="idade">.</label>
    <input type="number" id="idade" name="idade">
    <h4>E-mail para contato:</h4>
    <label for="email">.</label>
    <input type="email" id="email" name="email">
    <h4>Telefone para contato:</h4>
    <label for="telefone">.</label>
    <input type="tel" id="telefone" name="telefone">
 </form>
   <h2><i>COMENTÁRIOS</i></h2>

 <textarea name="comentarios" rows="5" cols="50" placeholder="Deixe seu comentário aqui..."></textarea>
  
 
 </fieldset>
 

 </nav>
 <h4>Finalizar o formulário:</h4>
 <form>
    <button type="submit" class="button" >Enviar</button>  
    <button type="reset" class="button" >Limpar</button >
 </form>
 </nav>
</body>
</html>
